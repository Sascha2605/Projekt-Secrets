name: Secrets Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Secret überprüfen
        env:
          DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Secret fehlt!"
            exit 1
          fi

          echo "Secret wurde erfolgreich geladen."
          echo "Der geheime Wert wird nicht ausgegeben."
